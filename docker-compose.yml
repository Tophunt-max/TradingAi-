# Local development stack. Not a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantai_dev_only}
      POSTGRES_DB: quantai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantai -d quantai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantai:${POSTGRES_PASSWORD:-quantai_dev_only}@postgres:5432/quantai
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # INDstocks price feed. Start with: docker compose --profile live up price-feed
  # Pass instruments as SEGMENT:TOKEN (see docs/indstocks.md).
  price-feed:
    build: ./backend
    profiles: ["live"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantai:${POSTGRES_PASSWORD:-quantai_dev_only}@postgres:5432/quantai
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.price_feed", "${PRICE_FEED_INSTRUMENTS:-NSE:2885}"]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
